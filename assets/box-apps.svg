<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6cf0"/>
      <stop offset="1" stop-color="#5b2fc0"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <!-- Rounded app tile -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#tile)"/>
  <!-- Folder box, like the folder icons in the dock -->
  <rect x="26" y="26" width="76" height="76" rx="18" fill="url(#box)"/>
  <rect x="26.75" y="26.75" width="74.5" height="74.5" rx="17.25" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Four app previews -->
  <rect x="36" y="36" width="25" height="25" rx="7" fill="#ffb02e"/>
  <rect x="67" y="36" width="25" height="25" rx="7" fill="#33c47a"/>
  <rect x="36" y="67" width="25" height="25" rx="7" fill="#3b9cf0"/>
  <rect x="67" y="67" width="25" height="25" rx="7" fill="#f2546b"/>
  <!-- Small marks inside each preview -->
  <circle cx="48.5" cy="48.5" r="5" fill="#ffffff" opacity="0.9"/>
  <path d="M73 49 L79.5 42.5 L86 49 L79.5 55.5 Z" fill="#ffffff" opacity="0.9"/>
  <rect x="43" y="74" width="11" height="11" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <path d="M79.5 73 L86 85 L73 85 Z" fill="#ffffff" opacity="0.9"/>
</svg>
